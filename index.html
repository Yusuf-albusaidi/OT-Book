<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perioperative Nursing Study Book</title>
<style>
:root{--bg:#f1f6f4;--bg2:#f5f1fa;--card:#fffffe;--ink:#1d2f33;--mute:#62777b;--line:#d9e5e2;--teal:#2c7a8a;--teal-d:#1d5a68;--mark:#f6d27a;--ok:#3f9a6b;--bad:#c0583f;--okbg:#e3f4ea;--badbg:#fbe8e3;--a:#4f9d8a;--g1:#2c7a8a;--g2:#5b8fd0;--g3:#8b78c4}
@media (prefers-color-scheme:dark){:root{--bg:#0f1b1e;--bg2:#17142a;--card:#162a2e;--ink:#e8f1ef;--mute:#9db4b8;--line:#2b4549;--teal:#6cc4cc;--teal-d:#9be0e6;--okbg:#173523;--badbg:#3a1d19;--mark:#c9a24a}}
*{box-sizing:border-box}
html,body{margin:0;color:var(--ink)}
body{background:linear-gradient(160deg,var(--bg),var(--bg2)) fixed;font:var(--fs,17px)/1.7 Georgia,"Times New Roman",serif;max-width:800px;margin:0 auto;padding:14px 14px 30px}
h1,h2,h3,button,input,select,.ui{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:linear-gradient(135deg,var(--g1),var(--g2) 55%,var(--g3));color:#fff;border-radius:18px;padding:16px 16px 14px;box-shadow:0 6px 20px rgba(60,90,140,.18)}
h1{font-size:1.3rem;line-height:1.3;margin:0 0 10px;color:#fff;font-weight:650}
.tools{display:flex;gap:8px;flex-wrap:wrap}
input,select{padding:11px 12px;border:0;border-radius:10px;background:rgba(255,255,255,.95);color:#1d2f33;font-size:.95rem}
.tools>*{min-width:0}#q,#chs{flex:1 1 220px;width:100%;max-width:100%;text-overflow:ellipsis}
main,.sec,.res,.fig,.fc,.opt,.fb{min-width:0;max-width:100%}
.sec,.res,.opt,.fc,.ch{overflow-wrap:anywhere}
.fc{white-space:normal}
.bar{height:8px;background:rgba(255,255,255,.3);border-radius:4px;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#fff;border-radius:4px;transition:width .3s}
.pl{font:.82rem system-ui,sans-serif;color:rgba(255,255,255,.92);margin-top:5px}
.meta{font:.82rem system-ui,sans-serif;color:var(--mute)}
nav{display:flex;gap:8px;margin:14px 0;position:sticky;top:0;padding:8px 0;z-index:2;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px)}
nav button{flex:1;padding:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;font-weight:600;font-size:.95rem;cursor:pointer}
nav button[aria-selected="true"]{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-color:transparent;box-shadow:0 3px 10px rgba(60,90,140,.25)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.ch{font-size:1.1rem;margin:14px 2px 0;color:var(--teal-d)}
.sec{--t:color-mix(in srgb,var(--a) 13%,var(--card));background:var(--card);border:1px solid color-mix(in srgb,var(--a) 28%,var(--line));border-top:6px solid var(--a);border-radius:16px;padding:14px 16px;margin-bottom:16px;box-shadow:0 3px 12px rgba(60,80,100,.07)}
.sec:nth-of-type(6n+1){--a:#4f9d8a}.sec:nth-of-type(6n+2){--a:#4a8fc2}.sec:nth-of-type(6n+3){--a:#8b78c4}
.sec:nth-of-type(6n+4){--a:#e0925e}.sec:nth-of-type(6n+5){--a:#cc6f8a}.sec:nth-of-type(6n+6){--a:#b99a4b}
.sec h2{font-size:1.08rem;margin:0 0 6px;color:color-mix(in srgb,var(--a) 70%,var(--ink))}
.sec.done{box-shadow:0 0 0 3px var(--ok),0 3px 12px rgba(60,80,100,.07)}
.sec.hit{box-shadow:0 0 0 4px var(--mark)}
.pg{font:.78rem system-ui,sans-serif;color:var(--mute);background:var(--t);padding:2px 9px;border-radius:999px;margin-left:4px}
.sec ul{margin:8px 0;padding-left:20px}.sec li{margin:7px 0}.sec li::marker{color:var(--a)}
.steps{display:flex;flex-wrap:wrap;gap:6px;list-style:none;padding:0!important}
.steps li{margin:0;font:600 .8rem system-ui,sans-serif;background:var(--t);border:1px solid var(--a);border-radius:999px;padding:4px 12px}
.steps li+li::before{content:"› ";color:var(--mute)}
.fig{font:.85rem system-ui,sans-serif;background:var(--t);border:1px dashed var(--a);border-radius:12px;padding:9px 12px;color:var(--mute)}
.fig img{max-width:100%;height:auto;display:block;border-radius:10px;cursor:zoom-in}
.mk,.row button,.opt{font:600 .92rem system-ui,sans-serif;padding:10px 15px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.mk{border-color:var(--a);background:transparent;color:color-mix(in srgb,var(--a) 70%,var(--ink))}
.done .mk{background:var(--ok);border-color:var(--ok);color:#fff}
.pri{background:linear-gradient(135deg,var(--g1),var(--g2))!important;color:#fff!important;border-color:transparent!important}
.fc{min-height:190px;background:linear-gradient(145deg,color-mix(in srgb,var(--g2) 14%,var(--card)),color-mix(in srgb,var(--g3) 16%,var(--card)));border:2px solid color-mix(in srgb,var(--g2) 45%,var(--line));border-radius:20px;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:1.15rem;cursor:pointer;width:100%;color:var(--ink);box-shadow:0 5px 16px rgba(60,80,120,.1)}
.fc.back{background:linear-gradient(135deg,var(--g1),var(--g3));color:#fff;border-color:transparent}
.row{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.opt{display:block;width:100%;text-align:left;margin:9px 0;font-weight:500;border-radius:14px}
.opt:hover{border-color:var(--g2)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad)}
.fb{font:.92rem/1.5 system-ui,sans-serif;background:var(--card);border-left:5px solid var(--mark);padding:10px 14px;border-radius:10px}
.res{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--g2);border-radius:12px;padding:10px 14px;margin:9px 0;cursor:pointer;color:var(--ink);font:.92rem/1.5 system-ui,sans-serif}
.res b{font-size:1rem}.res small{color:var(--mute);display:block}
mark{background:var(--mark);color:#1d2f33;padding:0 2px;border-radius:3px}
footer{margin-top:26px;padding-top:12px;border-top:1px solid var(--line);font:.8rem system-ui,sans-serif;color:var(--mute);text-align:center}
.pr{background:none;border:0;color:var(--teal-d);text-decoration:underline;cursor:pointer;font:600 .85rem system-ui,sans-serif}
.tools2{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 14px}
.tools2 button{font:600 .85rem system-ui,sans-serif;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.tools2 button.on{background:var(--ok);border-color:var(--ok);color:#fff}
.tip{font:.93rem/1.55 system-ui,sans-serif;background:color-mix(in srgb,var(--mark) 22%,var(--card));border-left:5px solid var(--mark);border-radius:10px;padding:9px 13px;margin:10px 0}
.tip b{display:block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
details.dt{margin:8px 0;border:1px solid color-mix(in srgb,var(--a) 40%,var(--line));border-radius:12px;background:var(--t);font:.93rem/1.55 system-ui,sans-serif}
details.dt summary{cursor:pointer;padding:9px 13px;font-weight:600;color:color-mix(in srgb,var(--a) 70%,var(--ink));list-style:none}
details.dt summary::-webkit-details-marker{display:none}
details.dt summary::before{content:"+ "}
details.dt[open] summary::before{content:"\2212 "}
details.dt>div{padding:0 13px 10px}
details.dt ul{margin:4px 0;padding-left:18px}
dl.tm{margin:0}dl.tm dt{font-weight:700;margin-top:6px}dl.tm dd{margin:0 0 4px}
.ck{display:flex;gap:9px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--line)}
.ck input{margin-top:4px;width:19px;height:19px;flex:none;accent-color:var(--ok)}
.qm{margin-bottom:12px}.qm .opt{width:auto}.qm .opt.on{background:var(--ok);color:#fff;border-color:var(--ok)}.ost{display:block;width:100%;text-align:left;margin:6px 0}.ost.ok{opacity:.85}
.stp{list-style:none;counter-reset:st;margin:6px 0;padding:0}
.stp li{counter-increment:st;display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.stp li:before{content:counter(st);flex:none;width:26px;height:26px;border-radius:50%;background:var(--ok);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.stb{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.rs{margin-top:8px;font:600 .8rem system-ui,sans-serif;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.recall .kp:not(.show){filter:blur(6px);cursor:pointer;user-select:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:root[data-theme="ocean"]{--cap:#2f7fc1;--bg:#eaf4fb;--bg2:#e0eefa;--card:#fff;--ink:#14293d;--mute:#5a7389;--line:#cfe0ee;--teal:#2f7fc1;--teal-d:#1d5a8f;--okbg:#e0f3ea;--badbg:#fbe8e3;--mark:#f6d27a;--g1:#1f78b4;--g2:#3fa7d6;--g3:#5ec4c9}
:root[data-theme="lavender"]{--cap:#8b78c4;--bg:#f4f0fa;--bg2:#ece5f8;--card:#fffefe;--ink:#2a2140;--mute:#74698c;--line:#e0d8ee;--teal:#7a62c0;--teal-d:#54419a;--okbg:#e5f3ea;--badbg:#fbe8ee;--mark:#f2d27f;--g1:#7a62c0;--g2:#9b86d8;--g3:#c08ad0}
:root[data-theme="rose"]{--cap:#e07a9b;--bg:#fbf0f2;--bg2:#f9e6ed;--card:#fffdfd;--ink:#3a2229;--mute:#8a6a73;--line:#efd9df;--teal:#c4577a;--teal-d:#92375a;--okbg:#e6f3ea;--badbg:#fbe4e4;--mark:#f4cf7e;--g1:#d1678a;--g2:#e48fa6;--g3:#e8a98d}
:root[data-theme="forest"]{--cap:#1f6b4a;--bg:#eef4ec;--bg2:#e3eedd;--card:#fdfffb;--ink:#1f2f22;--mute:#62775f;--line:#d5e3cf;--teal:#2f7a4f;--teal-d:#1f5a38;--okbg:#e3f2e0;--badbg:#f9e6e0;--mark:#efd27a;--g1:#2f7a4f;--g2:#5a9a5f;--g3:#8aab5a}
:root[data-theme="sunset"]{--cap:#e8873f;--bg:#fdf3ea;--bg2:#fbe7e0;--card:#fffdfa;--ink:#3a2a22;--mute:#8a7165;--line:#f0dccd;--teal:#d0703a;--teal-d:#9a4a1e;--okbg:#e8f2dd;--badbg:#fbe4dc;--mark:#f6cf6e;--g1:#e0794a;--g2:#e8a05a;--g3:#d56a8a}
.cap{fill:var(--cap,#2f9e7a);stroke:rgba(20,35,40,.45);stroke-width:1.4;stroke-linejoin:round}
.dc{display:none}
:root[data-theme="sepia"] .dc-band,:root[data-theme="night"] .dc-stars,:root[data-theme="ocean"] .dc-waves,:root[data-theme="lavender"] .dc-dots,:root[data-theme="rose"] .dc-flower,:root[data-theme="forest"] .dc-leaf,:root[data-theme="sunset"] .dc-sun{display:inline}
.pref select,#thm{font:600 .8rem system-ui,sans-serif;padding:6px 12px;border-radius:999px;border:0;background:rgba(255,255,255,.92);color:#1d2f33;cursor:pointer}

:root[data-theme="day"]{--cap:#2f9e7a;--bg:#f1f6f4;--bg2:#f5f1fa;--card:#fffffe;--ink:#1d2f33;--mute:#62777b;--line:#d9e5e2;--teal:#2c7a8a;--teal-d:#1d5a68;--okbg:#e3f4ea;--badbg:#fbe8e3;--mark:#f6d27a}
:root[data-theme="sepia"]{--cap:#8a6a3a;--bg:#f6efe0;--bg2:#efe4cc;--card:#fffaf0;--ink:#3b3226;--mute:#7a6c58;--line:#e2d5bb;--teal:#9a6f38;--teal-d:#6b4f26;--okbg:#eaf0d8;--badbg:#f6e1d6;--mark:#efc667;--g1:#a0763f;--g2:#c08a54;--g3:#b3646a}
:root[data-theme="night"]{--cap:#3b4a8f;--bg:#0f1b1e;--bg2:#17142a;--card:#162a2e;--ink:#e8f1ef;--mute:#9db4b8;--line:#2b4549;--teal:#6cc4cc;--teal-d:#9be0e6;--okbg:#173523;--badbg:#3a1d19;--mark:#c9a24a}
.mrow{display:flex;gap:14px;align-items:center;margin-top:4px}

.mas{flex:none;width:96px;height:108px;background:radial-gradient(closest-side,rgba(255,255,255,.22) 0%,rgba(255,255,255,.1) 55%,rgba(255,255,255,0) 100%);filter:drop-shadow(0 3px 5px rgba(0,0,0,.18));animation:flt 3.2s ease-in-out infinite}
@keyframes flt{50%{transform:translateY(-4px)}}
.say{position:relative;flex:1;min-width:0;min-height:2.4em;background:#fff;color:#1d2f33;border:2.5px solid #1d2f33;border-radius:20px;padding:9px 14px;font:700 .92rem/1.35 "Comic Sans MS","Chalkboard SE","Segoe Print",system-ui,sans-serif;box-shadow:3px 3px 0 rgba(0,0,0,.2);overflow-wrap:anywhere}
.say::before{content:"";position:absolute;left:-15px;top:50%;margin-top:-10px;border-style:solid;border-width:10px 13px 10px 0;border-color:transparent #1d2f33 transparent transparent}
.say::after{content:"";position:absolute;left:-9px;top:50%;margin-top:-7px;border-style:solid;border-width:7px 10px 7px 0;border-color:transparent #fff transparent transparent}
.say.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
.pref{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pref button{font:600 .8rem system-ui,sans-serif;padding:6px 12px;border-radius:999px;border:0;background:rgba(255,255,255,.92);color:#1d2f33;cursor:pointer}
.shelf{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;font:.78rem system-ui,sans-serif}
.shelf span{background:rgba(255,255,255,.22);border-radius:999px;padding:3px 10px}
.shelf .b{background:#fff;color:#1d2f33;font-weight:600}
.cf{position:fixed;top:-16px;width:9px;height:14px;z-index:99;pointer-events:none;border-radius:2px;animation:cfall 1.7s ease-in forwards}
@keyframes cfall{to{transform:translateY(110vh) rotate(560deg);opacity:.85}}
@media (prefers-reduced-motion:reduce){.mas,.say.pop{animation:none}.cf{display:none}}
@media print{.pref,.shelf,.say,.mas,.cf{display:none}}

@media print{body{background:#fff}header{background:none;color:#000;box-shadow:none;padding:0}h1{color:#000}header .tools,nav,.mk,.pr,.bar,.pl,.row,#q{display:none}.sec{break-inside:avoid;border:1px solid #999;border-top:4px solid #000;box-shadow:none}body{font-size:12pt;max-width:none}}
</style>
</head>

<script>

var CONFIG={
  title:"Perioperative Nursing Study Book",
  files:["chapters/ch01.js","chapters/ch02.js","chapters/ch03.js","chapters/ch04.js","chapters/ch05.js","chapters/ch06.js","chapters/ch07.js","chapters/ch08.js","chapters/ch09.js","chapters/ch10.js"],
  plan:[[1,"Concepts Basic to Perioperative Nursing"],[2,"Patient Safety and Risk Management"],[3,"Workplace Issues and Staff Safety"],[4,"Infection Prevention and Control"],[5,"Anesthesia"],[6,"Positioning the Patient for Surgery"],[7,"Sutures, Sharps, and Instruments"],[8,"Surgical Modalities"],[9,"Wound Healing, Dressings, and Drains"],[10,"Postoperative Patient Care and Pain Management"],[11,"Gastrointestinal Surgery"],[12,"Surgery of the Biliary Tract, Pancreas, Liver, and Spleen"],[13,"Hernia Repair"],[14,"Gynecologic and Obstetric Surgery"],[15,"Genitourinary Surgery"]]
};
/* ===== shell ===== */

var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var st={ch:null,tab:"read",ci:0,back:false,qi:0,sc:0,ans:false,recall:false,oi:0,og:-1,on:0,os:null,oc:null,qm:"quiz"};

function cur(){return byId(st.ch)}

function load(cb){var f=CONFIG.files,n=f.length;if(!n)return cb();f.forEach(function(u){var s=document.createElement("script");s.src=u;s.onload=s.onerror=function(){if(--n===0)cb()};document.head.appendChild(s)})}

function buildIdx(){IDX=[];BOOK.list.forEach(function(c){
  c.sections.forEach(function(s,i){IDX.push({c:c.id,k:"s",i:i,h:s.t,t:s.k.join(" ")+" "+(s.tip||"")+" "+(s.more||[]).join(" ")+" "+(s.terms||[]).map(function(x){return x[0]+" "+x[1]}).join(" ")+" "+(s.check?s.check.join(" "):"")+" "+(s.cl||[]).map(function(g){return g.t+" "+g.i.join(" ")}).join(" "),p:s.p})});
  c.cards.forEach(function(d,i){IDX.push({c:c.id,k:"c",i:i,h:d[0],t:d[1]})});
  c.quiz.forEach(function(q,i){IDX.push({c:c.id,k:"q",i:i,h:q.q,t:q.o.join(" ")+" "+q.e})})})}

function prog(){var tot=0,n=0;BOOK.list.forEach(function(c){tot+=c.sections.length;c.sections.forEach(function(_,i){if((done[c.id]||{})[i])n++})});
  $("pb").style.width=(tot?n/tot*100:0)+"%";$("pt").textContent=n+" of "+tot+" sections read across "+BOOK.list.length+" chapter"+(BOOK.list.length===1?"":"s")+" available"}

function menu(){$("chs").innerHTML=CONFIG.plan.map(function(p){var id="ch"+(p[0]<10?"0":"")+p[0],c=byId(id);
  return '<option value="'+(c?id:"")+'"'+(c?"":" disabled")+(st.ch===id?" selected":"")+">"+p[0]+". "+esc(p[1])+(c?"":" (coming soon)")+"</option>"}).join("")}

function render(){
  menu();prog();var c=cur(),m=$("main");
  if(!c){m.innerHTML='<p class="meta">No chapters loaded yet.</p>';return}
  var tabs=[["read","Read"],["cards","Flashcards"],["quiz","Quiz"]];
  var h='<p class="ch"><b>Chapter '+c.n+'</b> · '+esc(c.title)+' <span class="pg">'+esc(c.pages||"")+'</span></p><nav role="tablist">'+tabs.map(function(t){return '<button role="tab" data-t="'+t[0]+'" aria-selected="'+(st.tab===t[0])+'">'+t[1]+"</button>"}).join("")+"</nav>";
  if(st.tab==="read")h+=viewRead(c);else if(st.tab==="cards")h+=viewCards(c);else h+=viewQuiz(c);
  m.innerHTML=h;
}
function viewRead(c){var d=done[c.id]||{};
  var li=function(x){return"<li>"+esc(x)+"</li>"};
  var bar='<div class="tools2"><button data-a="exp">Expand all</button><button data-a="col">Collapse all</button><button data-a="rec" class="'+(st.recall?"on":"")+'">Recall mode: '+(st.recall?"on":"off")+"</button></div>";
  return bar+'<div class="'+(st.recall?"recall":"")+'">'+c.sections.map(function(s,i){
  var steps=s.steps?'<ul class="steps">'+s.steps.map(function(x){return"<li>"+esc(x)+"</li>"}).join("")+"</ul>":"";
  var f=s.fig;var fig="";
  if(f&&typeof f==="object")fig='<p class="fig"><img src="'+esc(f.src)+'" alt="'+esc(f.alt||"")+'" loading="lazy" data-zoom="1"><br>'+esc(f.cap||"")+"</p>";
  else if(f)fig='<p class="fig">'+esc(f)+"</p>";
  var tip=s.tip?'<div class="tip"><b>Clinical pearl</b>'+esc(s.tip)+"</div>":"";
  var more=s.more?'<details class="dt"><summary>More detail</summary><div><ul>'+s.more.map(li).join("")+"</ul></div></details>":"";
  var terms=s.terms?'<details class="dt"><summary>Key terms ('+s.terms.length+')</summary><div><dl class="tm">'+s.terms.map(function(t){return"<dt>"+esc(t[0])+"</dt><dd>"+esc(t[1])+"</dd>"}).join("")+"</dl></div></details>":"";
  var cl=(s.cl||[]).map(function(g){return'<details class="dt"><summary>In practice: '+esc(g.t)+" ("+g.i.length+" steps)</summary><div><ol class=\"stp\">"+g.i.map(function(x){return"<li><span>"+esc(x)+"</span></li>"}).join("")+'</ol><div class="stb"><button class="rs" data-a="pcard">Print this card</button><button class="rs" data-a="ccopy">Copy</button></div></div></details>'}).join("");
  var chk=s.check?'<details class="dt"><summary>Check yourself: '+esc(s.check[0])+"</summary><div>"+esc(s.check[1])+"</div></details>":"";
  return '<article class="sec'+(d[i]?" done":"")+'" id="s-'+i+'"><h2>'+esc(s.t)+' <span class="pg">'+esc(s.p)+"</span></h2><ul>"+s.k.map(function(x){return'<li class="kp">'+esc(x)+"</li>"}).join("")+"</ul>"+steps+tip+more+terms+cl+chk+fig+'<button class="mk" data-i="'+i+'">'+(d[i]?"Read ✓ (tap to undo)":"Mark as read")+"</button></article>"}).join("")+"</div>"}
function viewCards(c){var k=c.cards[st.ci];return '<button class="fc'+(st.back?" back":"")+'" id="fc" aria-live="polite">'+esc(st.back?k[1]:k[0])+'</button><div class="meta" style="margin-top:8px">Card '+(st.ci+1)+" of "+c.cards.length+(st.back?" · answer":" · question")+'</div><div class="row"><button data-a="prev">Back</button><button class="pri" data-a="flip">Flip card</button><button data-a="next">Next</button><button data-a="shuf">Shuffle</button></div>'}
function qset(c){return st.qm==="scen"?(c.sc||[]):c.quiz}
function ordList(c){var r=[];c.sections.forEach(function(s,si){(s.cl||[]).forEach(function(g){if(g.o)r.push(g)})});return r}
function viewQuiz(c){
  var sc=(c.sc||[]).length,od=ordList(c).length,m=st.qm||"quiz";
  var sw='<div class="row qm"><button class="opt'+(m==="quiz"?" on":"")+'" data-m="quiz">Quiz</button>'+(sc?'<button class="opt'+(m==="scen"?" on":"")+'" data-m="scen">Scenarios ('+sc+')</button>':"")+(od?'<button class="opt'+(m==="ord"?" on":"")+'" data-m="ord">Put in order ('+od+')</button>':"")+"</div>";
  if(m==="ord")return sw+viewOrd(c);
  var Q=qset(c);
  if(st.qi>=Q.length)return sw+'<div class="sec"><h2>'+(m==="scen"?"Scenarios":"Quiz")+' complete</h2><p>You scored <b>'+st.sc+" of "+Q.length+"</b>."+(st.sc<Q.length?" Review the sections, then try again.":" Strong result.")+'</p><div class="row"><button class="pri" data-a="qr">Try again</button></div></div>';
  var q=Q[st.qi];return sw+'<p class="meta">'+(m==="scen"?"Scenario ":"Question ")+(st.qi+1)+" of "+Q.length+" · score "+st.sc+'</p><h3 style="font-size:1.05rem">'+esc(q.q)+"</h3>"+q.o.map(function(o,i){return'<button class="opt" data-o="'+i+'">'+esc(o)+"</button>"}).join("")+'<div id="fb"></div>'}
function viewOrd(c){
  var G=ordList(c);if(!G.length)return '<div class="sec"><p class="meta">No ordering exercises in this chapter yet.</p></div>';if(st.oc!==c.id){st.oc=c.id;st.oi=0;st.os=null}if(!(st.oi>=0)||st.oi>=G.length)st.oi=0;var g=G[st.oi];
  if(!st.os||st.og!==st.oi){st.og=st.oi;st.on=0;st.os=g.i.map(function(x,i){return[x,i]}).sort(function(){return Math.random()-.5});if(g.i.length>1&&st.os[0][1]===0)st.os.push(st.os.shift())}
  var done=st.on>=g.i.length;
  return '<div class="sec"><h2>'+esc(g.t)+'</h2><p class="meta">Tap the steps in the correct order. Exercise '+(st.oi+1)+" of "+G.length+'</p>'+st.os.map(function(s){var d=s[1]<st.on;return'<button class="opt ost'+(d?" ok":"")+'" data-n="'+s[1]+'"'+(d?" disabled":"")+">"+(d?(s[1]+1)+". ":"")+esc(s[0])+"</button>"}).join("")+(done?'<p class="fb"><b>Done.</b> That is the order in the book.</p>':"")+'<div class="row"><button class="pri" data-a="onext">'+(done?"Next exercise":"Skip")+'</button><button class="rs" data-a="oshuf">Shuffle again</button></div></div>'}

$("main").addEventListener("click",function(e){
  var t=e.target,c=cur();if(!c)return;
  var b=t.closest("nav button");if(b){st.tab=b.dataset.t;render();return}
  var kp=t.closest(".kp");if(kp&&st.recall){kp.classList.toggle("show");return}
  b=t.closest(".mk");if(b){var i=b.dataset.i;done[c.id]=done[c.id]||{};done[c.id][i]=!done[c.id][i];save();var y=window.scrollY;render();window.scrollTo(0,y);
    if(done[c.id][i]){confetti(18);say(pick(READ));award("first","First section read","🌱");
      if(c.sections.every(function(_,j){return done[c.id][j]})&&award("read-"+c.id,"Chapter "+c.n+" read","📖")){confetti(70);say("Chapter "+c.n+" complete! You earned a badge.")}}
    return}
  if(t.dataset.zoom){window.open(t.src,"_blank");return}
  if(t.id==="fc"){st.back=!st.back;render();return}
  b=t.closest("[data-a]");if(b){var a=b.dataset.a,n=c.cards.length;
    if(a==="exp"||a==="col"){document.querySelectorAll("details.dt").forEach(function(x){x.open=(a==="exp")});return}
    if(a==="pcard"||a==="ccopy"){var dd=b.closest("details"),ti=dd.querySelector("summary").textContent.replace(/ \(\d+ steps\)$/,""),it=[].map.call(dd.querySelectorAll(".stp li span"),function(x){return x.textContent});
      if(a==="ccopy"){var tx=ti+"\n"+it.map(function(x,j){return(j+1)+". "+x}).join("\n")+"\nCreated by Yousuf Al Busaidi — 11764";try{navigator.clipboard.writeText(tx);b.textContent="Copied";setTimeout(function(){b.textContent="Copy"},1500)}catch(er){}return}
      var w=window.open("","_blank");if(!w)return;w.document.write("<!doctype html><meta charset=utf-8><title>"+esc(ti)+"</title><style>body{font:16px/1.5 system-ui,sans-serif;margin:24px}h1{font-size:20px}ol{padding-left:24px}li{margin:6px 0}small{color:#555}</style><h1>"+esc(ti)+"</h1><ol>"+it.map(function(x){return"<li>"+esc(x)+"</li>"}).join("")+"</ol><small>Created by Yousuf Al Busaidi — 11764</small>");w.document.close();w.focus();w.print();return}
    if(a==="rec"){st.recall=!st.recall;render();return}
    if(a==="flip")st.back=!st.back;else if(a==="next"){st.ci=(st.ci+1)%n;st.back=false}else if(a==="prev"){st.ci=(st.ci-1+n)%n;st.back=false}
    else if(a==="shuf"){c.cards.sort(function(){return Math.random()-.5});st.ci=0;st.back=false}
    else if(a==="onext"){st.oi=((st.oi||0)+1)%ordList(c).length;st.os=null}else if(a==="oshuf"){st.os=null}
    else if(a==="qn"){st.qi++;st.ans=false;if(st.qi>=qset(c).length)quizEnd(c)}else if(a==="qr"){st.qi=0;st.sc=0;st.ans=false}
    render();return}
  b=t.closest("[data-m]");if(b){st.qm=b.dataset.m;st.qi=0;st.sc=0;st.ans=false;render();return}
  b=t.closest(".ost");if(b&&!b.disabled){var n=+b.dataset.n,g=ordList(c)[st.oi||0];if(!g)return;
    if(n===st.on){st.on++;if(st.on>=g.i.length){confetti(25);say("Correct order. That is how you do it in practice!");award("order","Put in order","🔢")}else say(pick(OKM))}else{say("Not that one yet. Try the next step.");b.classList.add("bad");setTimeout(function(){b.classList.remove("bad")},500);return}
    var y=window.scrollY;render();window.scrollTo(0,y);return}
  b=t.closest(".opt");if(b&&!st.ans){st.ans=true;var q=qset(c)[st.qi],k=+b.dataset.o;
    document.querySelectorAll(".opt").forEach(function(x,j){if(j===q.a)x.classList.add("ok");else if(j===k)x.classList.add("bad")});
    if(k===q.a){st.sc++;confetti(10);say(pick(OKM))}else say(pick(BADM));
    $("fb").innerHTML='<p class="fb"><b>'+(k===q.a?"Correct. ":"Not quite. ")+"</b>"+esc(q.e)+'</p><div class="row"><button class="pri" data-a="qn">'+(st.qi===qset(c).length-1?"See score":"Next question")+"</button></div>"}
});

function open_(id,tab,idx){st.ch=id;st.tab=tab;st.qi=0;st.sc=0;st.ans=false;st.qm="quiz";st.os=null;st.oi=0;st.back=false;st.ci=(tab==="cards"&&idx)||0;$("q").value="";render();
  if(tab==="read"&&idx!=null){var el=$("s-"+idx);if(el){el.scrollIntoView({block:"start"});el.classList.add("hit");setTimeout(function(){el.classList.remove("hit")},2200)}}else window.scrollTo(0,0);
  try{history.replaceState(null,"","#"+id)}catch(e){}}
$("chs").onchange=function(){if(this.value)open_(this.value,"read")};

function search(){
  var raw=$("q").value.trim().toLowerCase();if(raw.length<2){render();return}
  var terms=raw.split(/\s+/),hits=[];
  IDX.forEach(function(r){var hay=(r.h+" "+r.t).toLowerCase();if(terms.every(function(t){return hay.indexOf(t)>-1}))hits.push({r:r,s:terms.every(function(t){return r.h.toLowerCase().indexOf(t)>-1})?0:1})});
  hits.sort(function(a,b){return a.s-b.s});
  var kind={s:"Section",c:"Flashcard",q:"Quiz"};
  var hl=function(s){var o=esc(s);terms.forEach(function(t){o=o.replace(new RegExp("("+esc(t).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"),"<mark>$1</mark>")});return o};
  var snip=function(r){var t=r.t,p=t.toLowerCase().indexOf(terms[0]);var a=Math.max(0,p-50);return(a?"…":"")+t.slice(a,a+160)+(t.length>a+160?"…":"")};
  var m=$("main");
  m.innerHTML='<p class="meta">'+hits.length+" result"+(hits.length===1?"":"s")+" for “"+esc(raw)+"”</p>"+(hits.length?hits.slice(0,40).map(function(h,n){var r=h.r,c=byId(r.c);return'<button class="res" data-n="'+n+'"><b>'+hl(r.h)+"</b><small>Chapter "+c.n+" · "+kind[r.k]+(r.p?" · "+esc(r.p):"")+"</small>"+hl(snip(r))+"</button>"}).join(""):'<p>Nothing found. Try a shorter or different word.</p>');
  m._hits=hits.slice(0,40);
}
$("q").addEventListener("input",search);
$("main").addEventListener("click",function(e){var b=e.target.closest(".res");if(!b)return;var h=this._hits[+b.dataset.n].r;open_(h.c,h.k==="s"?"read":h.k==="c"?"cards":"quiz",h.i)});


/* ===== charm: mascot, confetti, badges, themes ===== */
var pick=function(a){return a[Math.floor(Math.random()*a.length)]};
var READ=["Nice, section done!","Well done, one step closer.","Lovely, keep going!","Great reading!"];
var OKM=["Correct! Great job.","Yes, that is it!","Spot on."];
var BADM=["Not quite. Read the note and you will get it next time.","Good try! Learning happens here."];
function greet(){var hr=new Date().getHours();return hr<12?"Good morning! Ready for a calm study session?":hr<18?"Good afternoon! A little learning goes a long way.":"Good evening! Let’s learn at an easy pace."}
function say(m){var e=$("say");if(!e)return;e.textContent=m;e.classList.remove("pop");void e.offsetWidth;e.classList.add("pop")}
function confetti(n){try{if(window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches)return}catch(e){}
  var col=["#4f9d8a","#4a8fc2","#8b78c4","#e0925e","#cc6f8a","#b99a4b"];
  for(var i=0;i<n;i++){var s=document.createElement("i");s.className="cf";s.style.left=Math.random()*100+"vw";s.style.background=col[i%col.length];s.style.animationDelay=(Math.random()*.4)+"s";s.style.animationDuration=(1.3+Math.random()*.9)+"s";document.body.appendChild(s);(function(x){setTimeout(function(){x.remove()},2600)})(s)}}
var badges={};try{badges=JSON.parse(localStorage.getItem("book-badges")||"{}")}catch(e){}
function award(id,label,emoji){if(badges[id])return false;badges[id]={l:label,e:emoji};try{localStorage.setItem("book-badges",JSON.stringify(badges))}catch(e){}shelf();return true}
function shelf(){var k=Object.keys(badges);$("shelf").innerHTML=k.length?'<span>Badges</span>'+k.map(function(i){return'<span class="b">'+esc(badges[i].e)+" "+esc(badges[i].l)+"</span>"}).join(""):"<span>Earn badges as you study</span>"}
function quizEnd(c){var n=qset(c).length,qk=st.qm==="scen"?"scen-":"";
  if(st.sc===n){confetti(70);say("Perfect score! Amazing.");award("perfect-"+qk+c.id,(qk?"Perfect scenarios, Ch ":"Perfect quiz, Ch ")+c.n,"⭐")}
  else if(st.sc>=n*.7){confetti(25);say("Well done, great result!");award("quiz-"+qk+c.id,(qk?"Scenarios passed, Ch ":"Quiz passed, Ch ")+c.n,"🏅")}
  else say("Good effort. Read the sections again and retry!")}

var pref={theme:"auto",fs:17};
try{var pp=JSON.parse(localStorage.getItem("book-pref")||"{}");if(pp.theme)pref.theme=pp.theme;if(pp.fs)pref.fs=pp.fs}catch(e){}
var TORDER=["auto","day","sepia","night","ocean","lavender","rose","forest","sunset"];
var THM={auto:"🌓 Auto",day:"☀️ Day",sepia:"📜 Sepia",night:"🌙 Night",ocean:"🌊 Ocean",lavender:"💜 Lavender",rose:"🌸 Rose",forest:"🌲 Forest",sunset:"🌅 Sunset"};
function applyPref(){var r=document.documentElement;if(pref.theme==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",pref.theme);
  r.style.setProperty("--fs",pref.fs+"px");$("thm").textContent=(THM[pref.theme]||THM.auto);
  try{localStorage.setItem("book-pref",JSON.stringify(pref))}catch(e){}}
var TSAY={auto:"Back to automatic. Easy on the eyes!",day:"Bright and clear!",sepia:"Cozy like old paper.",night:"Starry night. Sweet reading!",ocean:"Ahoy! Calm waters ahead.",lavender:"So dreamy and calm.",rose:"Pretty in pink!",forest:"Fresh as a forest walk.",sunset:"Warm and golden!"};
$("thm").onclick=function(){var i=TORDER.indexOf(pref.theme);pref.theme=TORDER[(i+1)%TORDER.length];applyPref();say(TSAY[pref.theme]||"Nice choice!")};
$("fsm").onclick=function(){pref.fs=Math.max(14,pref.fs-1);applyPref()};
$("fsp").onclick=function(){pref.fs=Math.min(24,pref.fs+1);applyPref()};
applyPref();
window.addEventListener("beforeprint",function(){document.querySelectorAll("details.dt").forEach(function(x){x.open=true})});
$("bt").textContent=CONFIG.title;
load(function(){BOOK.list.sort(function(a,b){return a.n-b.n});buildIdx();
  var start=(location.hash||"").slice(1);st.ch=byId(start)?start:(BOOK.list[0]||{}).id;render();shelf();say(greet())});
</script>
</body>
